<!DOCTYPE html><html><head><title>Modal</title><style>
#modal{display:none;position:fixed;inset:0;background:#0008}#box{background:white;margin:15% auto;padding:25px;width:250px}
</style></head><body><button id="open">Open Modal</button><div id="modal"><div id="box"><button id="close">X</button><p>Hello! This is a modal popup.</p></div></div>
<script>open.onclick=()=>modal.style.display='block';close.onclick=()=>modal.style.display='none';modal.onclick=e=>{if(e.target===modal)modal.style.display='none';};</script></body></html>
