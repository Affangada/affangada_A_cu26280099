<!DOCTYPE html><html><head><title>Photo Gallery</title><style>
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.gallery img{width:100%;height:180px;object-fit:cover;transition:transform .3s}.gallery img:hover{transform:scale(1.06)}
</style></head><body><h2>Photo Gallery</h2><div class="gallery">
<img src="photo1.jpg" alt="Photo 1"><img src="photo2.jpg" alt="Photo 2"><img src="photo3.jpg" alt="Photo 3"><img src="photo4.jpg" alt="Photo 4">
</div></body></html>
