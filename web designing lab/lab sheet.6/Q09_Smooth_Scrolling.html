<!DOCTYPE html><html><head><title>Smooth Scroll</title><style>html{scroll-behavior:smooth}section{height:400px;padding:20px}nav a{margin:10px}</style></head>
<body><nav><a href="#home">Home</a><a href="#about">About</a></nav><section id="home"><h2>Home</h2></section><section id="about"><h2>About</h2></section>
<script>document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.querySelector(a.getAttribute('href')).scrollIntoView({behavior:'smooth'});}));</script></body></html>
