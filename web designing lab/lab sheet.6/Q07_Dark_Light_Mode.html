<!DOCTYPE html><html><head><title>Theme Toggle</title><style>
:root{--bg:white;--fg:#222}body{background:var(--bg);color:var(--fg);font-family:Arial;padding:30px}
body.dark{--bg:#222;--fg:white}button{padding:10px}
</style></head><body><h2>Theme Example</h2><p>Switch between light and dark mode.</p><button id="theme">Toggle Theme</button>
<script>theme.addEventListener('click',()=>document.body.classList.toggle('dark'));</script></body></html>
