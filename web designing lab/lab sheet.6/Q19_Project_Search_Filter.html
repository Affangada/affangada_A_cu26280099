<!DOCTYPE html><html><head><title>Project Filter</title></head><body><h2>Projects</h2>
<input id="search" placeholder="Search projects..."><div id="projects"><p class="project">Portfolio Website</p><p class="project">Bank Management System</p><p class="project">Tourism Website</p></div>
<script>search.addEventListener('input',()=>{let value=search.value.toLowerCase();document.querySelectorAll('.project').forEach(p=>p.style.display=p.textContent.toLowerCase().includes(value)?'block':'none');});</script></body></html>
